name: Portfolio checks

on:
  push:
    branches:
      - phase3/automated-qa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Build and verify generated HTML
        id: build
        run: npm run build
      - name: Run complete Playwright suite against committed references
        run: npm test
      - name: Verify Worker response headers (local only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/portfolio-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/verify-worker-headers.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa-evidence
          path: |
            artifacts/
            test-results/
            /tmp/portfolio-wrangler.log
          if-no-files-found: ignore
          retention-days: 7
