name: Portfolio checks

on:
  push:
    branches:
      - phase3/automated-qa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Build and verify generated HTML
        id: build
        run: npm run build
      - name: Run complete Playwright suite against committed references
        run: npm test
      - name: Verify Worker response headers (local only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/portfolio-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/verify-worker-headers.mjs
      - name: Build and verify production indexing
        run: npm run build:production
      - name: Run full production Playwright suite
        run: npm test
        env:
          TEST_DEPLOYMENT_ENV: production
      - name: Verify production Worker and preview-host protection (local only)
        shell: bash
        run: |
          ./node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/portfolio-worker
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/portfolio-local.key -out /tmp/portfolio-local.crt -days 1 -subj /CN=localhost -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' > /tmp/portfolio-local-cert.log 2>&1
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8788 --persist-to /tmp/portfolio-tls-state --local-protocol https --https-key-path /tmp/portfolio-local.key --https-cert-path /tmp/portfolio-local.crt > /tmp/portfolio-production-wrangler.log 2>&1 &
          worker_pid=$!
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8789 --persist-to /tmp/portfolio-http-state --inspector-port 9231 > /tmp/portfolio-http-wrangler.log 2>&1 &
          http_worker_pid=$!
          trap 'kill "$worker_pid" "$http_worker_pid" 2>/dev/null || true' EXIT
          LOCAL_WORKER_URL=https://127.0.0.1:8788 LOCAL_WORKER_CA=/tmp/portfolio-local.crt LOCAL_WORKER_HTTP_URL=http://127.0.0.1:8789 LOCAL_WORKER_BUNDLE=/tmp/portfolio-worker/worker.js node scripts/verify-worker-headers.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa-evidence
          path: |
            artifacts/
            test-results/
            /tmp/portfolio-wrangler.log
            /tmp/portfolio-production-wrangler.log
            /tmp/portfolio-http-wrangler.log
          if-no-files-found: ignore
          retention-days: 7
