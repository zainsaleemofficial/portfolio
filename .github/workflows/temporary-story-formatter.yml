name: Temporary story formatting
on:
  push:
    branches:
      - feature/my-story-editorial-v2
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/my-story-editorial-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format the five story files without changing any other files
        run: |
          ./node_modules/.bin/prettier --write src/data/story-editorial.html src/pages/my-story/index.astro src/styles/globals.css src/styles/story-editorial.css tests/story-editorial.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/story-editorial.html src/pages/my-story/index.astro src/styles/globals.css src/styles/story-editorial.css tests/story-editorial.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: format approved My Story integration'
            git push origin HEAD:feature/my-story-editorial-v2
          fi
