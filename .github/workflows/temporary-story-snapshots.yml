name: Temporary reviewed My Story baselines
on:
  push:
    branches:
      - feature/my-story-editorial-v2
permissions:
  contents: write
jobs:
  snapshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/my-story-editorial-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Refresh only owner-approved, manually reviewed screenshot baselines
        shell: bash
        run: |
          npx playwright test tests/visual.spec.ts --update-snapshots
          git add -- tests/visual.spec.ts-snapshots
          git diff --cached --name-only > /tmp/snapshot-files
          cat /tmp/snapshot-files
          test "$(wc -l < /tmp/snapshot-files)" -eq 6
          while IFS= read -r filename; do
            case "$filename" in
              tests/visual.spec.ts-snapshots/home-desktop-linux.png|tests/visual.spec.ts-snapshots/home-sage-desktop-linux.png|tests/visual.spec.ts-snapshots/contact-desktop-linux.png|tests/visual.spec.ts-snapshots/mobile-navigation-open-linux.png|tests/visual.spec.ts-snapshots/story-mobile-linux.png|tests/visual.spec.ts-snapshots/story-desktop-linux.png) ;;
              *) echo "Unexpected changed screenshot: $filename" >&2; exit 1;;
            esac
          done < /tmp/snapshot-files
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: approve reviewed My Story and shared navigation references'
          git push origin HEAD:feature/my-story-editorial-v2
